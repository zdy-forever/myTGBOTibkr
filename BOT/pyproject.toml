[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-quant-portfolio"
version = "0.1.0"
description = "Multi-user Telegram portfolio management and quant signal delivery"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "python-telegram-bot[job-queue]>=21,<23",
  "APScheduler>=3.10,<4",
  "cryptography>=42,<47",
  "phonenumbers>=8.13,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.6,<1"]

[project.scripts]
quant-bot = "quantbot.main:main"
quant-backup = "quantbot.backup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
